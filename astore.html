<script>
/* ===== DIÁLOGOS ASTORE · reemplazan alert / confirm / prompt nativos de Android =====
   alert(msg)            → cuadro propio (no bloquea; devuelve undefined como el original)
   await avConfirm(msg)  → true/false     await avPrompt(msg,valor) → texto o null */
(function(){
'use strict';
if(window.__avDlg)return;window.__avDlg=1;
const TITLE=(window.AV_DIALOG_TITLE||'Astore');
const css=document.createElement('style');
css.textContent=`
#avDlgBack{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(6,26,21,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .16s}
#avDlgBack.on{opacity:1}
#avDlg{width:min(400px,100%);background:#fff;color:#14201d;border-radius:24px;padding:22px 20px 16px;box-shadow:0 24px 70px rgba(6,26,21,.45);border:1px solid #d1fae5;transform:translateY(10px) scale(.97);transition:transform .18s;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-height:88vh;overflow:auto}
#avDlgBack.on #avDlg{transform:none}
#avDlg .avd-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin:0 auto 10px;background:#ecfdf5}
#avDlg.warn .avd-ic{background:#fef3c7}#avDlg.err .avd-ic{background:#fee2e2}#avDlg.ok .avd-ic{background:#d1fae5}
#avDlg .avd-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#047857;text-align:center;margin-bottom:6px}
#avDlg.warn .avd-t{color:#b45309}#avDlg.err .avd-t{color:#be123c}
#avDlg .avd-m{font-size:16px;line-height:1.45;text-align:center;white-space:pre-wrap;word-break:break-word;margin:0 2px 16px}
#avDlg input{width:100%;box-sizing:border-box;padding:13px 14px;border:1.5px solid #a7f3d0;border-radius:12px;font:inherit;font-size:16px;margin:-4px 0 16px;outline:none}
#avDlg input:focus{border-color:#10b981;box-shadow:0 0 0 3px #10b98128}
#avDlg .avd-b{display:flex;gap:10px}
#avDlg button{flex:1;min-height:48px;border-radius:14px;border:0;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
#avDlg .avd-ok{background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 5px 16px #10b98133}
#avDlg.err .avd-ok.danger,#avDlg .avd-ok.danger{background:linear-gradient(135deg,#f43f5e,#be123c);box-shadow:0 5px 16px #f43f5e33}
#avDlg .avd-no{background:#eef2f1;color:#14201d}
@media(prefers-color-scheme:dark){#avDlg{background:#10241d;color:#ecfdf5;border-color:#1c4a38}#avDlg .avd-no{background:#173a2e;color:#ecfdf5}#avDlg input{background:#0b211a;color:#ecfdf5;border-color:#1c4a38}}
@media(max-width:520px){#avDlgBack{align-items:flex-end;padding:12px}#avDlg{border-radius:26px}}`;
document.head.appendChild(css);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function kind(t){
  if(/^\s*(✅|✓|☑)|(guardad[oa]|listo|correct[oa]|éxito|exitos|registrad[oa]|actualizad[oa]|copiad[oa])/i.test(t)&&!/error|no se pudo|inv[aá]lid/i.test(t))return['ok','✅'];
  if(/(no se pudo|error|inv[aá]lid|incorrect|fall[oó]|no existe|ya existe|no permite|no tiene acceso|no coincid|vencid)/i.test(t))return['err','⛔'];
  if(/(primero|falta|debes|debe |elige|selecciona|completa|revisa|obligatori|requiere|atenci[oó]n|⚠)/i.test(t))return['warn','⚠️'];
  return['','💬'];
}
const queue=[];let busy=false;
function next(){if(busy||!queue.length)return;busy=true;show(queue.shift())}
function show(o){
  const back=document.createElement('div');back.id='avDlgBack';
  const [k,ic]=o.kind||kind(o.msg);
  const isP=o.mode==='prompt',isC=o.mode==='confirm'||isP;
  back.innerHTML=`<div id="avDlg" class="${k}" role="alertdialog" aria-modal="true" aria-label="${esc(o.title||TITLE)}"><div class="avd-ic">${o.icon||(isC&&!isP&&o.danger?'🗑️':isP?'✏️':isC&&!k?'❓':ic)}</div><div class="avd-t">${esc(o.title||TITLE)}</div><div class="avd-m">${esc(o.msg)}</div>${isP?`<input id="avdIn" type="${o.type||'text'}" value="${esc(o.def||'')}" autocomplete="off">`:''}<div class="avd-b">${isC?`<button class="avd-no" type="button">${esc(o.cancel||'Cancelar')}</button>`:''}<button class="avd-ok${o.danger?' danger':''}" type="button">${esc(o.ok||'Aceptar')}</button></div></div>`;
  document.body.appendChild(back);requestAnimationFrame(()=>back.classList.add('on'));
  const input=back.querySelector('#avdIn'),okb=back.querySelector('.avd-ok'),nob=back.querySelector('.avd-no');
  const prev=document.activeElement;
  let done=false;
  const close=v=>{if(done)return;done=true;document.removeEventListener('keydown',onKey,true);back.classList.remove('on');setTimeout(()=>{back.remove();busy=false;try{prev&&prev.focus&&prev.focus()}catch(e){}o.resolve(v);next()},140)};
  const accept=()=>close(isP?(input.value):true), cancel=()=>close(isP?null:false);
  okb.onclick=accept;if(nob)nob.onclick=cancel;
  back.addEventListener('mousedown',e=>{if(e.target===back&&isC)cancel()});
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();isC?cancel():accept()}else if(e.key==='Enter'&&!(e.target&&e.target.tagName==='BUTTON')){e.preventDefault();e.stopPropagation();accept()}};
  document.addEventListener('keydown',onKey,true);
  setTimeout(()=>{(input||okb).focus();if(input)input.select()},60);
}
function ask(o){return new Promise(res=>{o.resolve=res;queue.push(o);next()})}
const norm=(m,o)=>Object.assign({msg:String(m==null?'':m)},o||{});
window.avAlert=(m,o)=>ask(norm(m,Object.assign({mode:'alert'},o)));
window.avConfirm=(m,o)=>ask(norm(m,Object.assign({mode:'confirm'},o)));
window.avPrompt=(m,def,o)=>ask(norm(m,Object.assign({mode:'prompt',def:def||''},o)));
window.alert=function(m){ if(!document.body){return} ask(norm(m,{mode:'alert'})) };
/* Los alert/confirm/prompt nativos ya no deberían usarse: por si algún código viejo llama a confirm/prompt de forma síncrona,
   se conserva el nativo como último recurso (para no romper la lógica). */
})();

/* ===== Astore Admin V4 =====
   Dos modos con la misma pantalla:
   · LOCAL  (sin nube): datos en el navegador, clave propia con hash. Sirve para probar/demos.
   · NUBE   (Supabase): login real, datos en Postgres con RLS, claves/tokens solo en el servidor. */
const CLOUD_KEY="astore_admin_cloud", LOCAL_KEY="astore_admin_v4_data", AUTH_KEY="astore_admin_v4_auth", SESSION_KEY="astore_admin_v4_session";
const PLANES=["Básico","Pro","Ultra"], PLAN_CODE={"Básico":"basico","Pro":"pro","Ultra":"ultra"}, PLAN_NAME={basico:"Básico",pro:"Pro",ultra:"Ultra"};
const LIMITES={"Básico":{suc:1,usr:3},"Pro":{suc:3,usr:10},"Ultra":{suc:Infinity,usr:Infinity}};
const SUPABASE_JS="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
let data={tiendas:[],sucursales:[],usuarios:[],pagos:[]}, B=null, section="inicio";
const $=id=>document.getElementById(id);
function esc(v=""){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const daysTo=d=>Math.round((new Date(d+"T00:00:00Z")-new Date(today()+"T00:00:00Z"))/864e5);
const getStore=id=>data.tiendas.find(x=>x.id===id), getBranch=id=>data.sucursales.find(x=>x.id===id);
const money=n=>"S/ "+(Number(n)||0).toFixed(2);

/* Estado real según pago */
function estadoReal(s){
  if(s.status==="suspended"||s.estado==="suspendida")return{t:"Suspendida",c:"off",k:"susp"};
  if(s.status==="trial"||!s.paidUntil){const d=s.trialUntil?daysTo(s.trialUntil):0;return d>=0?{t:"Prueba · "+d+" d",c:"info",k:"prueba"}:{t:"Prueba vencida",c:"off",k:"venc"};}
  const d=daysTo(s.paidUntil);
  if(d>5)return{t:"Al día",c:"on",k:"ok"};
  if(d>=0)return{t:"Vence en "+d+" d",c:"warn",k:"porvencer"};
  if(d>=-7)return{t:"En gracia ("+(7+d)+" d)",c:"warn",k:"gracia"};
  return{t:"Vencida",c:"off",k:"venc"};
}

/* ================= ADAPTADOR LOCAL ================= */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function pbk(pass,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,256))}
const LocalB={
  name:"local",
  hasAuth(){return !!localStorage.getItem(AUTH_KEY)},
  async setup(pass){const salt=crypto.getRandomValues(new Uint8Array(16));localStorage.setItem(AUTH_KEY,JSON.stringify({salt:hex(salt),h:await pbk(pass,salt)}))},
  async login(user,pass){const a=JSON.parse(localStorage.getItem(AUTH_KEY)||"null");if(!a)throw Error("Primero crea una contraseña.");
    const salt=new Uint8Array(a.salt.match(/../g).map(x=>parseInt(x,16)));if(await pbk(pass,salt)!==a.h)throw Error("Contraseña incorrecta.");sessionStorage.setItem(SESSION_KEY,"1")},
  async resume(){return sessionStorage.getItem(SESSION_KEY)==="1"},
  async logout(){sessionStorage.removeItem(SESSION_KEY)},
  async load(){const d=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null")||{tiendas:[],sucursales:[],usuarios:[],pagos:[]};d.pagos||=[];return d},
  persist(){localStorage.setItem(LOCAL_KEY,JSON.stringify(data));publishToPOS()},
  async saveStore(obj,id){
    if(id){Object.assign(getStore(id),obj);return id}
    const nid=crypto.randomUUID();
    data.tiendas.push({id:nid,...obj,status:"trial",estado:"activa",trialUntil:addDays(today(),14),paidUntil:null,billing:{provider:"nubefact",endpoint:"",env:"beta",enabled:false,tokenSet:false},fechaCreacion:new Date().toISOString()});
    data.sucursales.push({id:crypto.randomUUID(),tiendaId:nid,nombre:"Sede principal",codigo:"PRINCIPAL",direccion:obj.direccion||"",telefono:obj.telefono||"",principal:true,estado:"activa"});
    this.persist();return nid},
  async setStatus(id,st){const s=getStore(id);s.status=st;s.estado=st==="suspended"?"suspendida":"activa";this.persist()},
  async saveBranch(obj,id){if(id)Object.assign(getBranch(id),obj);else data.sucursales.push({id:crypto.randomUUID(),...obj});this.persist()},
  async setBranchStatus(id,est){const b=getBranch(id);b.estado=est;this.persist()},
  async saveUser(obj,id){if(id)Object.assign(data.usuarios.find(x=>x.id===id),obj);else data.usuarios.push({id:crypto.randomUUID(),...obj});this.persist()},
  async addPayment(p){
    data.pagos.push({id:crypto.randomUUID(),...p});
    const s=getStore(p.tiendaId);const base=s.paidUntil&&s.paidUntil>today()?s.paidUntil:today();
    const d=new Date(base+"T00:00:00Z");d.setUTCMonth(d.getUTCMonth()+Number(p.meses));
    s.paidUntil=d.toISOString().slice(0,10);s.status="active";s.estado="activa";this.persist()},
  async saveBilling(id,b,token){const s=getStore(id);s.billing={...s.billing,...b};if(token){s.billing.tokenSet=true;s.billing._token=token}this.persist()},
  /* catálogo compartido */
  _cat(){data.catalogo||=[];return data.catalogo},
  async catCounts(){const c={pendiente:0,aprobado:0,rechazado:0};this._cat().forEach(x=>c[x.estado]++);return c},
  async catList({q="",estado="",page=0,size=50}){const f=fold(q);let r=this._cat().filter(x=>(!estado||x.estado===estado)&&(!f||fold([x.barcode,x.nombre,x.marca,x.categoria].join(" ")).includes(f)));
    r=[...r].sort((a,b)=>(a.estado==="pendiente"?0:1)-(b.estado==="pendiente"?0:1)||String(a.nombre).localeCompare(b.nombre));return{total:r.length,rows:r.slice(page*size,page*size+size)}},
  async catSetStatus(codes,estado){const s=new Set(codes);this._cat().forEach(x=>{if(s.has(x.barcode))x.estado=estado});this.persist()},
  async catSave(o,isNew){const l=this._cat(),i=l.findIndex(x=>x.barcode===o.barcode);
    if(isNew&&i>=0)throw Error("Ese código ya existe en el catálogo.");if(i>=0)Object.assign(l[i],o);else l.push({...o,estado:"aprobado",origen:"admin",votos:0});this.persist()},
  async catImport(rows,origen){let nuevos=0,actualizados=0;const l=this._cat(),m=new Map(l.map(x=>[x.barcode,x]));
    rows.forEach(r=>{const e=m.get(r.barcode);if(e){e.nombre=r.nombre;e.marca=r.marca||e.marca;e.tamano=r.tamano||e.tamano;e.categoria=r.categoria||e.categoria;if(e.estado!=="rechazado")e.estado="aprobado";actualizados++}
      else{const n={...r,estado:"aprobado",origen,votos:0};l.push(n);m.set(r.barcode,n);nuevos++}});this.persist();return{nuevos,actualizados,invalidos:0}}
};

/* ================= ADAPTADOR SUPABASE ================= */
function SupaB(cfg){
  let sb=null;
  const must=r=>{if(r.error)throw Error(r.error.message||String(r.error));return r.data};
  const fn=async(body)=>{const r=await sb.functions.invoke("admin-users",{body});if(r.error)throw Error((r.data&&r.data.error)||r.error.message);return r.data};
  const lib=async()=>{if(sb)return;if(!window.supabase)await new Promise((ok,no)=>{const s=document.createElement("script");s.src=SUPABASE_JS;s.onload=ok;s.onerror=()=>no(Error("No se pudo cargar la librería de Supabase (¿sin internet?)"));document.head.appendChild(s)});
    sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true}})};
  const mapStore=(t,acc)=>({id:t.id,nombre:t.name,propietario:t.owner_name||"",ruc:t.ruc||"",telefono:t.phone||"",direccion:t.address||"",plan:PLAN_NAME[t.plan_code]||"Básico",
    regimen:t.regimen,tipoContribuyente:t.taxpayer_type||"Persona natural",status:t.status,estado:t.status==="suspended"?"suspendida":"activa",trialUntil:t.trial_until,paidUntil:t.paid_until,hasPin:!!t.pin_hash,
    billing:acc?{provider:acc.provider,endpoint:acc.endpoint||"",env:acc.environment,enabled:acc.enabled,tokenSet:!!acc.token_set}:{provider:"nubefact",endpoint:"",env:"beta",enabled:false,tokenSet:false}});
  return{
    name:"supabase",
    hasAuth(){return true},
    async login(email,pass){await lib();const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error)throw Error("Correo o contraseña incorrectos.");
      const p=await sb.from("profiles").select("role,status").eq("id",r.data.user.id).single();
      if(p.error||!p.data||p.data.role!=="superadmin"||p.data.status!=="active"){await sb.auth.signOut();throw Error("Esta cuenta no tiene acceso al panel de administración.")}},
    async resume(){try{await lib();const s=await sb.auth.getSession();if(!s.data.session)return false;
      const p=await sb.from("profiles").select("role").eq("id",s.data.session.user.id).single();return p.data?.role==="superadmin"}catch(e){return false}},
    async logout(){await lib();await sb.auth.signOut()},
    async load(){
      const [t,b,p,pay,acc]=await Promise.all([sb.from("tenants").select("*").order("created_at"),sb.from("branches").select("*"),sb.from("profiles").select("*").neq("role","superadmin"),sb.from("payments").select("*").order("paid_on",{ascending:false}),sb.from("invoicing_accounts").select("*")]);
      const accs=Object.fromEntries(must(acc).map(a=>[a.tenant_id,a]));
      return{tiendas:must(t).map(x=>mapStore(x,accs[x.id])),
        sucursales:must(b).map(x=>({id:x.id,tiendaId:x.tenant_id,nombre:x.name,codigo:x.code||"",direccion:x.address||"",telefono:x.phone||"",principal:x.is_main,estado:x.status==="active"?"activa":"suspendida"})),
        usuarios:must(p).map(x=>({id:x.id,tiendaId:x.tenant_id,sucursalId:x.branch_id,nombre:x.full_name,usuario:x.username||"",rol:x.role,estado:x.status==="active"?"activa":"suspendida"})),
        pagos:must(pay).map(x=>({id:x.id,tiendaId:x.tenant_id,monto:Number(x.amount),meses:x.months,metodo:x.method||"",ref:x.reference||"",fecha:x.paid_on}))}},
    persist(){},
    async saveStore(o,id){
      const row={name:o.nombre,owner_name:o.propietario,ruc:o.ruc||null,phone:o.telefono,address:o.direccion,regimen:o.regimen,taxpayer_type:o.tipoContribuyente,plan_code:PLAN_CODE[o.plan]};
      if(id){must(await sb.from("tenants").update(row).eq("id",id));if(o.pin)must(await sb.rpc("set_tenant_pin",{p_tenant:id,p_pin:o.pin}));return id}
      const nid=must(await sb.rpc("admin_create_tenant",{p_name:o.nombre,p_ruc:o.ruc||"",p_regimen:o.regimen,p_plan:PLAN_CODE[o.plan],p_owner:o.propietario,p_phone:o.telefono,p_pin:o.pin||null}));
      must(await sb.from("tenants").update({address:o.direccion,taxpayer_type:o.tipoContribuyente}).eq("id",nid));return nid},
    async setStatus(id,st){must(await sb.from("tenants").update({status:st}).eq("id",id))},
    async saveBranch(o,id){const row={tenant_id:o.tiendaId,name:o.nombre,code:o.codigo||null,address:o.direccion,phone:o.telefono,is_main:o.principal,status:o.estado==="activa"?"active":"suspended"};
      if(id)must(await sb.from("branches").update(row).eq("id",id));else must(await sb.from("branches").insert(row))},
    async setBranchStatus(id,est){must(await sb.from("branches").update({status:est==="activa"?"active":"suspended"}).eq("id",id))},
    async saveUser(o,id){await fn({action:"upsert_user",id,tenant_id:o.tiendaId,branch_id:o.sucursalId,full_name:o.nombre,username:o.usuario,email:o.email,password:o.password,role:o.rol,pin:o.pin,status:o.estado==="activa"?"active":"suspended"})},
    async addPayment(p){must(await sb.from("payments").insert({tenant_id:p.tiendaId,amount:p.monto,months:p.meses,method:p.metodo,reference:p.ref,paid_on:p.fecha}))},
    async saveBilling(id,b,token){must(await sb.from("invoicing_accounts").update({provider:b.provider,endpoint:b.endpoint,environment:b.env,enabled:b.enabled}).eq("tenant_id",id));
      if(token)await fn({action:"set_token",tenant_id:id,token})},
    /* catálogo compartido */
    async catCounts(){const c={pendiente:0,aprobado:0,rechazado:0};const m={pendiente:"pending",aprobado:"approved",rechazado:"rejected"};
      await Promise.all(Object.keys(m).map(async k=>{const r=await sb.from("catalog_products").select("barcode",{count:"exact",head:true}).eq("status",m[k]);if(r.error)throw Error(r.error.message);c[k]=r.count||0}));return c},
    async catList({q="",estado="",page=0,size=50}){const m={pendiente:"pending",aprobado:"approved",rechazado:"rejected"},im={pending:"pendiente",approved:"aprobado",rejected:"rechazado"};
      let r=sb.from("catalog_products").select("*",{count:"exact"});if(estado)r=r.eq("status",m[estado]);
      const s=q.trim().replace(/[%,()]/g," ");if(s)r=r.or(`name.ilike.%${s}%,brand.ilike.%${s}%,barcode.ilike.%${s}%`);
      r=r.order("status",{ascending:false}).order("name").range(page*size,page*size+size-1);const x=await r;if(x.error)throw Error(x.error.message);
      return{total:x.count||0,rows:x.data.map(p=>({barcode:p.barcode,nombre:p.name,marca:p.brand||"",tamano:p.size||"",categoria:p.category||"",imagen:p.image_url||"",estado:im[p.status],origen:p.source,votos:p.votes}))}},
    async catSetStatus(codes,estado){const m={pendiente:"pending",aprobado:"approved",rechazado:"rejected"};must(await sb.from("catalog_products").update({status:m[estado],updated_at:new Date().toISOString()}).in("barcode",codes))},
    async catSave(o,isNew){const row={barcode:o.barcode,name:o.nombre,brand:o.marca||null,size:o.tamano||null,category:o.categoria||null,image_url:o.imagen||null};
      if(isNew)must(await sb.from("catalog_products").insert({...row,status:"approved",source:"admin"}));else must(await sb.from("catalog_products").update(row).eq("barcode",o.barcode))},
    async catImport(rows,origen){const tot={nuevos:0,actualizados:0,invalidos:0};
      for(let i=0;i<rows.length;i+=500){const r=must(await sb.rpc("admin_import_catalog",{p_rows:rows.slice(i,i+500).map(x=>({barcode:x.barcode,name:x.nombre,brand:x.marca,size:x.tamano,category:x.categoria})),p_source:origen}));
        tot.nuevos+=r.nuevos;tot.actualizados+=r.actualizados;tot.invalidos+=r.invalidos}return tot}
  };
}

async function saveStore(e,id){
  e.preventDefault();const ruc=$("sRuc").value.trim(),pin=$("sPin").value.trim();
  if(ruc&&!/^\d{11}$/.test(ruc))return alert("El RUC debe tener 11 dígitos.");

  if(ruc&&data.tiendas.some(t=>t.ruc===ruc&&t.id!==id))return alert("Ya existe una tienda con ese RUC.");
  const o={nombre:$("sNombre").value.trim(),propietario:$("sProp").value.trim(),ruc,telefono:$("sTel").value.trim(),plan:$("sPlan").value,regimen:$("sRegimen").value,tipoContribuyente:$("sTipo").value,pin,direccion:$("sDir").value.trim(),taxStatus:"activo"};

function openPayment(id=""){

/* ================= EAN ================= */
function eanOk(c){if(!/^\d+$/.test(c)||![8,12,13,14].includes(c.length))return false;let s=0;const n=c.length;for(let i=1;i<n;i++){s+=Number(c[n-1-i])*(i%2===1?3:1)}return (10-s%10)%10===Number(c[n-1])}
function fixEan(raw){ // Excel suele quitar ceros a la izquierda y deja notación científica
  let c=String(raw??"").trim();if(/^\d+(\.\d+)?e\+?\d+$/i.test(c))c=String(Number(c).toFixed(0));c=c.replace(/\D/g,"");if(!c)return"";
  if(eanOk(c))return c;for(const L of [8,12,13,14]){if(c.length<L){const p=c.padStart(L,"0");if(eanOk(p))return p}}return c}
/* lector .xlsx/.csv sin librerías (zip+XML) */
async function inflate(u8){
  const ds=new DecompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('No es un archivo .xlsx válido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={},dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    out[name]={method,csize,off};p+=46+nl+el+cl;
  }
  const get=async name=>{const f=out[name];if(!f)return null;const ln=dv.getUint16(f.off+26,true),le=dv.getUint16(f.off+28,true),s=f.off+30+ln+le,raw=u8.subarray(s,s+f.csize);return f.method===0?raw:await inflate(raw);};
  return {names:Object.keys(out),get};
}
const colIdx=ref=>{const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1;};
async function readXlsx(buf){
  const z=await unzip(buf),dec=new TextDecoder(),parse=t=>new DOMParser().parseFromString(t,'text/xml');
  const txt=async n=>{const b=await z.get(n);return b?dec.decode(b):null;};
  const wbx=parse(await txt('xl/workbook.xml')),relx=parse(await txt('xl/_rels/workbook.xml.rels'));
  const rel={};[...relx.getElementsByTagName('Relationship')].forEach(r=>{rel[r.getAttribute('Id')]=r.getAttribute('Target');});
  const shared=[];const ss=await txt('xl/sharedStrings.xml');
  if(ss){[...parse(ss).getElementsByTagName('si')].forEach(si=>{let s='';const walk=nd=>{for(const c of nd.childNodes){if(c.nodeName==='t')s+=c.textContent;else if(c.nodeName==='r'){[...c.childNodes].forEach(x=>{if(x.nodeName==='t')s+=x.textContent;});}}};walk(si);shared.push(s);});}
  const sheets=[];
  for(const sh of [...wbx.getElementsByTagName('sheet')]){
    const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id');
    let tg=rel[rid]||'';tg=tg.replace(/^\//,'');const path=tg.startsWith('xl/')?tg:'xl/'+tg;
    const x=await txt(path);if(!x)continue;
    const doc=parse(x),rows=[];let cells=0;
    [...doc.getElementsByTagName('row')].forEach(r=>{
      const ri=(+r.getAttribute('r')||rows.length+1)-1,arr=[];
      [...r.getElementsByTagName('c')].forEach(c=>{
        const ref=c.getAttribute('r'),t=c.getAttribute('t'),vEl=c.getElementsByTagName('v')[0];let v=null;
        if(t==='inlineStr'){v=[...c.getElementsByTagName('t')].map(n=>n.textContent).join('');}
        else if(vEl){const raw=vEl.textContent;v=t==='s'?(shared[+raw]||''):t==='str'?raw:t==='b'?raw==='1':t==='e'?null:(raw!==''&&isFinite(raw)?Number(raw):raw);}
        if(v!==null&&v!==''){arr[ref?colIdx(ref):arr.length]=v;cells++;}
      });
      if(arr.length)rows[ri]=arr;
    });
    const dense=[];for(let i=0;i<rows.length;i++)dense.push(rows[i]?Array.from(rows[i],x=>x===undefined?'':x):[]);
    sheets.push({name:sh.getAttribute('name'),rows:dense,cells});
  }
  if(!sheets.length)throw new Error('El archivo no tiene hojas con datos');
  sheets.sort((a,b)=>b.cells-a.cells);return sheets;
}
function readCsv(text){
  const first=text.split(/\r?\n/).slice(0,5).join('\n');
  const cnt=ch=>(first.match(new RegExp(ch==='\t'?'\t':'\\'+ch,'g'))||[]).length;
  const d=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return [{name:'CSV',rows:rows.map(r=>r.map(c=>{const s=String(c).trim();return s!==''&&/^-?\d+([.,]\d+)?$/.test(s)?Number(s.replace(',','.')):s;})),cells:rows.length}];
}
async function readFile(file){
  const buf=await file.arrayBuffer(),u8=new Uint8Array(buf);
  if(u8[0]===0x50&&u8[1]===0x4b)return readXlsx(buf);
  if(u8[0]===0xd0&&u8[1]===0xcf)throw new Error('Es un Excel antiguo (.xls). Ábrelo y guárdalo como .xlsx o CSV.');
  let t=new TextDecoder('utf-8').decode(u8);if(t.includes('�'))t=new TextDecoder('windows-1252').decode(u8);
  return readCsv(t.replace(/^﻿/,''));
}


/* ---- Catálogo compartido ---- */
const fold=s=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const gtinOk=c=>eanOk(c);
let CAT={q:"",estado:"",page:0,size:50,rows:[],total:0,counts:{pendiente:0,aprobado:0,rechazado:0}};
function catalogo(){
  setTimeout(catLoad,0);
  return `<div class="head"><div><h2>Catálogo de productos</h2><div class="muted">Base compartida: las tiendas escanean y los datos aparecen solos. Nunca incluye precios ni stock.</div></div><div class="actions"><button class="secondary" onclick="catExport()">⬇️ Exportar</button><button class="secondary" onclick="openCatSave()">+ Producto</button><button class="primary" onclick="openCatImport()">📥 Importar Excel / CSV</button></div></div>
  <div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="muted">Por revisar</div><div class="stat" id="catPend">…</div></div><div class="card"><div class="muted">Aprobados</div><div class="stat" id="catApr">…</div></div><div class="card"><div class="muted">Rechazados</div><div class="stat" id="catRej">…</div></div></div>
  <div class="panel"><div class="toolbar"><input id="catQ" placeholder="Buscar por código, nombre, marca o categoría..." value="${esc(CAT.q)}" oninput="catSearch()"><select id="catEst" onchange="catSearch()" style="max-width:190px"><option value="">Todos</option><option value="pendiente">Por revisar</option><option value="aprobado">Aprobados</option><option value="rechazado">Rechazados</option></select><button class="secondary" onclick="catApproveVisible()">✔ Aprobar los visibles por revisar</button></div>
  <div class="table-wrap"><table><thead><tr><th>Código</th><th>Producto</th><th>Marca · tamaño</th><th>Origen</th><th>Estado</th><th></th></tr></thead><tbody id="catRows"><tr><td colspan="6" class="empty">Cargando…</td></tr></tbody></table></div>
  <div class="actions" style="justify-content:space-between;margin-top:10px"><span class="mini" id="catInfo"></span><span class="actions"><button class="secondary" onclick="catPage(-1)">← Anterior</button><button class="secondary" onclick="catPage(1)">Siguiente →</button></span></div></div>`;
}
let catT=null;
function catSearch(){clearTimeout(catT);catT=setTimeout(()=>{CAT.q=$("catQ").value;CAT.estado=$("catEst").value;CAT.page=0;catLoad()},250)}
function catPage(d){const max=Math.max(0,Math.ceil(CAT.total/CAT.size)-1);CAT.page=Math.min(max,Math.max(0,CAT.page+d));catLoad()}
async function catLoad(){
  try{const [l,c]=await Promise.all([B.catList({q:CAT.q,estado:CAT.estado,page:CAT.page,size:CAT.size}),B.catCounts()]);CAT.rows=l.rows;CAT.total=l.total;CAT.counts=c;}catch(e){if($("catRows"))$("catRows").innerHTML=`<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`;return}
  if(!$("catRows"))return;$("catEst").value=CAT.estado;
  $("catPend").textContent=CAT.counts.pendiente;$("catApr").textContent=CAT.counts.aprobado;$("catRej").textContent=CAT.counts.rechazado;
  const bd={pendiente:"warn",aprobado:"on",rechazado:"off"},nm={pendiente:"Por revisar",aprobado:"Aprobado",rechazado:"Rechazado"};
  $("catRows").innerHTML=CAT.rows.length?CAT.rows.map(p=>`<tr><td><code>${esc(p.barcode)}</code></td><td><b>${esc(p.nombre)}</b><br><span class="mini">${esc(p.categoria||"")}</span></td><td>${esc(p.marca||"—")}<br><span class="mini">${esc(p.tamano||"")}</span></td><td><span class="badge mute">${esc(p.origen)}</span>${p.estado==="pendiente"?`<br><span class="mini">${p.votos} tienda(s)</span>`:""}</td><td><span class="badge ${bd[p.estado]}">${nm[p.estado]}</span></td>
   <td><div class="actions">${p.estado!=="aprobado"?`<button class="primary" onclick="catSet('${p.barcode}','aprobado')">Aprobar</button>`:""}${p.estado!=="rechazado"?`<button class="danger" onclick="catSet('${p.barcode}','rechazado')">Rechazar</button>`:""}<button class="secondary" onclick="openCatSave('${p.barcode}')">Editar</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="empty">No hay productos${CAT.q||CAT.estado?" con ese filtro":" todavía. Importa una lista de un distribuidor para empezar"}.</td></tr>`;
  const a=CAT.page*CAT.size;$("catInfo").textContent=CAT.total?`${a+1}–${Math.min(CAT.total,a+CAT.size)} de ${CAT.total}`:"";
}
async function catSet(code,est){try{await B.catSetStatus([code],est);toast(est==="aprobado"?"Aprobado":"Rechazado");catLoad()}catch(e){alert(e.message)}}
async function catApproveVisible(){const c=CAT.rows.filter(p=>p.estado==="pendiente").map(p=>p.barcode);if(!c.length)return toast("No hay pendientes en esta página");
  if(!(await avConfirm("¿Aprobar "+c.length+" productos por revisar?",{ok:"Aprobar"})))return;try{await B.catSetStatus(c,"aprobado");toast(c.length+" aprobados");catLoad()}catch(e){alert(e.message)}}
function openCatSave(code=""){const p=code?CAT.rows.find(x=>x.barcode===code):{barcode:"",nombre:"",marca:"",tamano:"",categoria:""};
  $("modalTitle").textContent=code?"Editar producto":"Nuevo producto del catálogo";
  $("modalBody").innerHTML=`<form onsubmit="saveCat(event,${code?"false":"true"})"><div class="field"><label>Código de barras *</label><input id="kCode" inputmode="numeric" maxlength="14" required value="${esc(p.barcode)}" ${code?"readonly":""}></div>
  <div class="field"><label>Nombre *</label><input id="kName" required maxlength="160" value="${esc(p.nombre)}" placeholder="Ej: Leche Gloria Evaporada Entera 400 g"></div>
  <div class="grid2"><div class="field"><label>Marca</label><input id="kBrand" value="${esc(p.marca)}"></div><div class="field"><label>Tamaño / contenido</label><input id="kSize" value="${esc(p.tamano)}" placeholder="400 g, 1 L, 500 ml"></div></div>
  <div class="field"><label>Categoría</label><input id="kCat" value="${esc(p.categoria)}" placeholder="Lácteos, Bebidas, Abarrotes..."></div>
  <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`;$("modal").classList.remove("hidden")}
async function saveCat(e,isNew){e.preventDefault();const c=$("kCode").value.replace(/\s/g,"");
  if(isNew&&!gtinOk(c))return alert("Código de barras inválido (revisa los dígitos: EAN-8, UPC-A, EAN-13 o GTIN-14 con dígito verificador correcto).");
  try{await B.catSave({barcode:c,nombre:$("kName").value.trim(),marca:$("kBrand").value.trim(),tamano:$("kSize").value.trim(),categoria:$("kCat").value.trim()},isNew);closeModal();toast("Producto guardado");catLoad()}catch(er){alert(er.message)}}

/* importar lista de distribuidor */
const CAT_COLS={barcode:/\b(barras|ean|gtin|upc|codigo de barra|cod\.? ?barra|barcode|codigo)\b/,nombre:/\b(descripcion|producto|nombre|articulo|item|detalle)\b/,marca:/\bmarca\b/,tamano:/\b(tamano|presentacion|contenido|medida|peso|volumen|formato|unidad de medida)\b/,categoria:/\b(categoria|rubro|linea|familia|clase)\b/};
let CI=null;
function openCatImport(){CI={sheets:null,rows:[],hdr:0,map:{}};$("modalTitle").textContent="Importar al catálogo";
  $("modalBody").innerHTML=`<div id="ciBody"><p class="muted">Sube la lista de un distribuidor (Excel o CSV) con <b>código de barras</b> y <b>nombre</b>. Marca, tamaño y categoría son opcionales. No importes precios: el catálogo no los guarda.</p>
  <label class="primary" style="display:block;text-align:center;padding:14px;border-radius:12px;cursor:pointer">📁 Elegir archivo<input type="file" id="ciFile" accept=".xlsx,.csv,.tsv,.txt" style="display:none" onchange="ciPick(event)"></label></div>`;$("modal").classList.remove("hidden")}
async function ciPick(e){const f=e.target.files[0];if(!f)return;
  try{CI.sheets=await readFile(f);CI.file=f.name;ciSheet(0)}catch(er){alert(er.message)}}
function ciSheet(i){const sh=CI.sheets[i];CI.sheetI=i;CI.all=sh.rows;let best=0,bs=-1;
  for(let r=0;r<Math.min(40,CI.all.length);r++){const row=CI.all[r]||[];let s=0;row.forEach(c=>{if(typeof c==="string"){const f=fold(c);Object.values(CAT_COLS).forEach(re=>{if(re.test(f))s++})}});if(s>bs){bs=s;best=r}}
  CI.hdr=best;ciDetect();ciView()}
function ciDetect(){const row=CI.all[CI.hdr]||[];CI.map={};
  Object.keys(CAT_COLS).forEach(k=>{const i=row.findIndex((c,ci)=>typeof c==="string"&&CAT_COLS[k].test(fold(c))&&!Object.values(CI.map).includes(ci));if(i>=0)CI.map[k]=i});
  if(CI.map.barcode===undefined){let bi=-1,bc=0;const n=Math.max(...CI.all.slice(CI.hdr+1,CI.hdr+60).map(r=>(r||[]).length),0);for(let c=0;c<n;c++){let k=0;CI.all.slice(CI.hdr+1,CI.hdr+60).forEach(r=>{if(gtinOk(ciCode(r?.[c])))k++});if(k>bc){bc=k;bi=c}}if(bi>=0)CI.map.barcode=bi}
  if(CI.map.nombre===undefined){const n=Math.max(...CI.all.slice(CI.hdr+1,CI.hdr+60).map(r=>(r||[]).length),0);let bi=-1,bl=0;for(let c=0;c<n;c++){if(c===CI.map.barcode)continue;const L=CI.all.slice(CI.hdr+1,CI.hdr+60).reduce((a,r)=>a+(typeof r?.[c]==="string"?r[c].length:0),0);if(L>bl){bl=L;bi=c}}if(bi>=0)CI.map.nombre=bi}}
const ciCode=v=>(v==null||v==="")?"":fixEan(typeof v==="number"?v.toFixed(0):v);
function ciBuild(){const m=CI.map,ok=[],bad={codigo:0,nombre:0,dup:0};const seen=new Set();
  CI.all.slice(CI.hdr+1).forEach(r=>{if(!r||!r.length)return;const code=ciCode(r[m.barcode]),nm=String(r[m.nombre]??"").replace(/\s+/g," ").trim();
    if(!code&&!nm)return;if(!gtinOk(code)){bad.codigo++;return}if(nm.length<2){bad.nombre++;return}if(seen.has(code)){bad.dup++;return}seen.add(code);
    ok.push({barcode:code,nombre:nm.slice(0,160),marca:m.marca>=0&&m.marca!=null?String(r[m.marca]??"").trim().slice(0,80):"",tamano:m.tamano!=null?String(r[m.tamano]??"").trim().slice(0,60):"",categoria:m.categoria!=null?String(r[m.categoria]??"").trim().slice(0,80):""})});
  CI.ok=ok;CI.bad=bad}
function ciView(){ciBuild();const row=CI.all[CI.hdr]||[],opts=(sel)=>`<option value="">— no importar —</option>`+row.map((c,i)=>`<option value="${i}" ${sel===i?"selected":""}>${esc(String(c||"Columna "+(i+1)))}</option>`).join("");
  const sel=k=>`<div class="field" style="margin:0"><label>${{barcode:"Código de barras *",nombre:"Nombre *",marca:"Marca",tamano:"Tamaño",categoria:"Categoría"}[k]}</label><select onchange="ciSet('${k}',this.value)">${opts(CI.map[k])}</select></div>`;
  $("ciBody").innerHTML=`<div class="note">📄 <b>${esc(CI.file)}</b> · ${CI.sheets.length>1?`hoja <select onchange="ciSheet(+this.value)" style="width:auto;padding:4px">${CI.sheets.map((s,i)=>`<option value="${i}" ${i===CI.sheetI?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`:"1 hoja"} · fila de títulos: ${CI.hdr+1}</div>
  <div class="grid2">${sel("barcode")}${sel("nombre")}${sel("marca")}${sel("tamano")}</div><div style="margin-top:8px">${sel("categoria")}</div>
  <div class="panel" style="margin:12px 0;padding:12px"><b>${CI.ok.length}</b> productos listos · <span class="mini">${CI.bad.codigo} sin código válido (dígito verificador) · ${CI.bad.nombre} sin nombre · ${CI.bad.dup} repetidos</span>
  <div class="table-wrap"><table style="min-width:0"><tbody>${CI.ok.slice(0,5).map(p=>`<tr><td><code>${esc(p.barcode)}</code></td><td>${esc(p.nombre)}</td><td class="mini">${esc(p.marca)} ${esc(p.tamano)}</td></tr>`).join("")||'<tr><td class="empty">Elige las columnas de código y nombre.</td></tr>'}</tbody></table></div></div>
  <div class="field"><label>Origen de la lista</label><select id="ciOrigen"><option value="distribuidor">Distribuidor / mayorista</option><option value="admin">Carga propia</option><option value="openfoodfacts">Open Food Facts</option></select></div>
  <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" ${CI.ok.length?"":"disabled"} onclick="ciRun()">Importar ${CI.ok.length} productos</button></div>`}
function ciSet(k,v){if(v==="")delete CI.map[k];else CI.map[k]=+v;ciView()}
async function ciRun(){const b=document.querySelector("#ciBody .primary:last-child");if(b){b.disabled=true;b.textContent="Importando…"}
  try{const r=await B.catImport(CI.ok,$("ciOrigen").value);closeModal();toast(`Listo: ${r.nuevos} nuevos, ${r.actualizados} actualizados`);catLoad()}catch(e){alert(e.message);ciView()}}
async function catExport(){const out=[["codigo_barras","nombre","marca","tamano","categoria","estado","origen"]];let p=0;
  for(;;){const l=await B.catList({q:CAT.q,estado:CAT.estado,page:p,size:1000});l.rows.forEach(r=>out.push([r.barcode,r.nombre,r.marca,r.tamano,r.categoria,r.estado,r.origen]));if((p+1)*1000>=l.total)break;p++}
  const csv="﻿"+out.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="catalogo-astore-"+today()+".csv";a.click()}

/* ================= ARRANQUE ================= */
async function start(){
  const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||"null")||window.ASTORE_CLOUD;
  B=(c&&c.url&&c.anonKey)?(window.__astoreBackendFactory?window.__astoreBackendFactory(c):SupaB(c)):LocalB;
  const cloud=B.name==="supabase", first=!cloud&&!B.hasAuth();
  $("lblUser").textContent=cloud?"Correo":"Usuario";$("loginUser").type=cloud?"email":"text";
  if(!cloud)$("loginUser").value="admin";
  $("loginSub").textContent=cloud?"Panel de administración · nube":first?"Primera vez: crea tu contraseña de administrador":"Panel de administración · modo local";
  $("pass2Box").classList.toggle("hidden",!first);$("loginBtn").textContent=first?"Crear contraseña e ingresar":"Ingresar";
  $("cloudLink").classList.toggle("hidden",cloud);
  $("cloudLink").onclick=openCloud;
  $("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="";$("loginBtn").disabled=true;
    try{
      if(first){if($("loginPass").value!==$("loginPass2").value)throw Error("Las contraseñas no coinciden.");await LocalB.setup($("loginPass").value)}
      await B.login($("loginUser").value.trim(),$("loginPass").value);await showApp();
    }catch(er){$("loginMsg").textContent=er.message}finally{$("loginBtn").disabled=false}};
  $("logoutBtn").onclick=async()=>{await B.logout();location.reload()};
  document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>render(b.dataset.section));
  if(await B.resume())await showApp();
}
async function showApp(){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");await refresh("inicio")}
start();
